<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Box - Konect</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="chat-page">

<div class="app-layout" style="height: 100vh; overflow: hidden; margin: 0; padding: 0; max-width: 100%; border: none;">
    <div id="sidebar" style="width: 360px; background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 10;">
        <div class="sidebar-header" style="padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="hamburger-btn" onclick="toggleLeftSidebar()" style="background: none; border: none; color: var(--primary); cursor: pointer; padding: 0; display: flex; align-items: center; transition: color 0.2s;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div id="sidebar-logo" class="logo" style="font-size: 20px; font-weight: bold; cursor: pointer; color: var(--primary);" onclick="window.location.href='/main'">KoNect</div>
            </div>

            <button id="sidebar-home-btn" class="btn-action btn-profile" style="height: 32px; font-size: 12px; padding: 0 12px; border-radius: 16px;" onclick="window.location.href='/main'">Trang chủ</button>
        </div>
        <div class="friend-list" style="overflow-y: auto; flex: 1; padding: 16px; overflow-x: hidden;">
            <h3 class="widget-title text-primary" style="font-size: 14px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">BẠN BÈ - FRIENDS</h3>
            <div id="friends-list" style="margin-bottom: 24px; width: 100%;"><p style="font-size: 13px; color: var(--text-muted); text-align: center;">Đang tải...</p></div>
            
            <div id="sidebar-separator" style="display: none; border-top: 1px solid var(--border); margin: 0 10px 12px 10px;"></div>
            
            <h3 class="widget-title text-primary" style="font-size: 14px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">CÁC NHÓM - GROUPS</h3>
            <div id="groups-list" style="width: 100%;"><p style="font-size: 13px; color: var(--text-muted); text-align: center;">Đang tải...</p></div>
        </div>
    </div>

    <div id="chat-container" style="flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg);">
        <div id="empty-state" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: var(--text-muted);">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px; opacity: 0.5;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <p>Chọn một đoạn chat để bắt đầu.</p>
        </div>

        <div id="chat-ui" style="display: none; flex-direction: column; height: 100%; width: 100%; position: relative;">
            
            <div id="chat-header" style="padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); flex-shrink: 0; z-index: 5;">
                <div id="chat-avatar" class="widget-avatar" style="margin-right: 12px; flex-shrink: 0; cursor: pointer;" onclick="handleHeaderClick()" title="Thông tin"></div>
                <div style="display: flex; flex-direction: column; flex: 1; overflow: hidden; cursor: pointer;" onclick="handleHeaderClick()" title="Thông tin">
                    <span id="chat-title" style="font-weight: 800; font-size: 18px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Tên Nhóm Chat</span>
                    <span id="chat-subtitle" style="font-size: 13px; color: var(--text-muted);">...</span>
                </div>
                
                <div style="display: flex; gap: 16px; align-items: center; margin-left: auto;">
                    <button id="leave-btn" class="btn-action" style="height: 32px; padding: 0 16px; border-radius: 16px; border: 1px solid #ff4d4f; color: #ff4d4f; background: transparent; font-size: 13px; font-weight: bold;" >Rời nhóm</button>
                    
                    <button id="toggle-members-btn" class="btn-action" style="height: 36px; width: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: transparent; color: var(--text); transition: color 0.2s ease;" onclick="toggleMembersSidebar()" title="Ẩn/Hiện thành viên">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </button>
                </div>
            </div>

            <div style="display: flex; flex-direction: row; flex: 1; min-height: 0; position: relative;">
                <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
                    <div id="chat-box" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;"></div>
                    <div id="input-area" style="display: flex; padding: 16px; border-top: 1px solid var(--border); background: var(--bg-2); gap: 12px; align-items: center; flex-shrink: 0;">
                        <input type="file" id="image-upload" accept="image/*" style="display: none;" onchange="uploadImage(event)">
                        <button class="btn-action" style="height: 44px; width: 44px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--border); color: var(--text); flex-shrink: 0;" onclick="document.getElementById('image-upload').click()" title="Gửi ảnh">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        </button>
                        <input type="text" id="message-input" class="edit-input" style="margin: 0; border-radius: 24px; padding: 12px 20px; background: var(--bg); border: 1px solid var(--border);" placeholder="Nhập tin nhắn...">
                        <button id="send-btn" class="btn-action btn-primary" style="height: 44px; border-radius: 24px; padding: 0 24px;">Gửi</button>
                    </div>
                </div>

                <div id="members-sidebar" style="width: 260px; background: var(--bg-2); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;">
                    <div style="padding: 18px 20px; border-bottom: 1px solid var(--border); font-weight: bold; color: var(--text); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Thành viên (<span id="member-count">0</span>)</div>
                    <div id="members-list" style="flex: 1; overflow-y: auto; padding: 10px;"><p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 20px;">Đang tải...</p></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://dfbklcbregcxzngpiorx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmYmtsY2JyZWdjeHpuZ3Bpb3J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4NTI2MTIsImV4cCI6MjA4OTQyODYxMn0.3EOOOodNiaa46ptAksdTY43_vknTIxhejcJCbVN441w';
    const mySupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentChatType = 'group';
    let globalUserId = null;
    let currentGroupId = null;
    let globalMessagesChannel = null; 
    const recentlySentIds = new Set(); 

    async function initApp() {
        const { data: { session } } = await mySupabase.auth.getSession();
        if (session) {
            globalUserId = session.user.id;
            loadSidebar();
            setupGlobalRealtimeListener();
            
            const urlParams = new URLSearchParams(window.location.search);

            const targetId = urlParams.get('group');
            if (targetId) {
                const { data: groupData } = await mySupabase.from('groups').select('id, title, cover_url').eq('id', targetId).maybeSingle();
                if (groupData) {
                    openChatRoom(groupData.id, groupData.title, groupData.cover_url, 'group');
                }
                else {
                    const { data: userData } = await mySupabase.from('profiles').select('id, full_name, username, avatar_url').eq('id', targetId).maybeSingle();
                    if (userData) {
                        const name = userData.full_name || userData.username;
                        openChatRoom(userData.id, name, userData.avatar_url, 'dm');
                    }
                }
            }

        } else {
            window.location.href = '/';
        }
    }

    function handleHeaderClick() {
        if (currentChatType === 'dm' && currentGroupId) {
            window.location.href = `/profile?id=${currentGroupId}`;
        } else if (currentChatType === 'group') {
            toggleMembersSidebar();
        }
    }

    async function resetUnreadCount(groupId) {
        const { data: { session } } = await mySupabase.auth.getSession();
        if (!session || !groupId) return;

        const activeUserId = session.user.id;

        const { data: latestMsg } = await mySupabase
            .from('messages')
            .select('created_at')
            .eq('group_id', groupId)
            .order('created_at', { ascending: false })
            .limit(1)
            .maybeSingle();

        let targetDate = latestMsg ? new Date(latestMsg.created_at) : new Date();
        targetDate.setMinutes(targetDate.getMinutes() + 1);
        const timestamp = targetDate.toISOString();

        await mySupabase
            .from('group_members')
            .update({ last_read_at: timestamp })
            .eq('group_id', groupId)
            .eq('user_id', activeUserId);
    }

    function moveGroupToTop(groupId) {
        const snippetEl = document.getElementById(`sidebar-snippet-${groupId}`);
        if (!snippetEl) return;
        
        const groupCard = snippetEl.closest('.group-sidebar-item');
        const groupsListContainer = document.getElementById('groups-list');
        
        if (groupCard && groupsListContainer) {
            groupsListContainer.prepend(groupCard);
            
            groupCard.style.transition = 'background 0.5s ease';
            groupCard.style.background = 'rgba(74, 144, 226, 0.4)';
            setTimeout(() => {
                groupCard.style.background = (String(groupId) === String(currentGroupId)) ? 'rgba(74, 144, 226, 0.15)' : 'transparent';
            }, 500);
        }
    }

    function toggleMembersSidebar() {
        const sidebar = document.getElementById('members-sidebar');
        const btn = document.getElementById('toggle-members-btn');
        sidebar.classList.toggle('collapsed');
        
        if (sidebar.classList.contains('collapsed')) {
            btn.style.color = 'var(--text)';
        } else {
            btn.style.color = 'var(--primary)';
        }
    }

    async function loadGroupMembers(groupId) {
        const { data } = await mySupabase.from('group_members').select(`role, status, profiles!inner(id, full_name, username, avatar_url)`).eq('group_id', groupId);
        const list = document.getElementById('members-list');
        list.innerHTML = '';
        
        if (data && data.length > 0) {
            document.getElementById('member-count').innerText = data.length;
            document.getElementById('chat-subtitle').innerText = `${data.length} thành viên`;
            data.sort((a, b) => (a.role === 'admin' ? -1 : 1));

            data.forEach(m => {
                const user = m.profiles;
                const name = user.full_name || user.username || "Ẩn danh";
                const isAdmin = m.role === 'admin' || m.status === 'admin'; 
                const roleBadge = isAdmin ? `<span style="font-size: 10px; background: rgba(255, 215, 0, 0.2); color: gold; padding: 2px 6px; border-radius: 4px; flex-shrink: 0;">Admin</span>` : '';
                const avatarHtml = user.avatar_url ? `<div class="widget-avatar" style="background-image: url(${user.avatar_url}); background-size: cover; width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;"></div>` : `<div class="widget-avatar" style="width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; background: var(--border); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--primary); font-size: 14px;">${name.charAt(0).toUpperCase()}</div>`;
                
                const div = document.createElement('div');
                div.style.cssText = "display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-bottom: 2px;";
                div.onmouseover = () => div.style.background = 'rgba(7, 37, 77, 0.4)'; 
                div.onmouseout = () => div.style.background = 'transparent';
                div.onclick = () => window.location.href = `/profile?id=${user.id}`;
                div.innerHTML = `${avatarHtml}<div style="flex: 1; min-width: 0; display: flex; flex-direction: column;"><div style="display: flex; align-items: center; gap: 6px; width: 100%;"><div style="font-size: 14px; font-weight: bold; color: ${isAdmin ? 'var(--primary)' : 'var(--text)'}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${name}</div>${roleBadge}</div><div style="font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">@${user.username || 'user'}</div></div>`;
                list.appendChild(div);
            });
        } else {
            document.getElementById('member-count').innerText = 0; document.getElementById('chat-subtitle').innerText = "0 thành viên";
            list.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 20px;">Lỗi tải thành viên.</p>';
        }
    }

    async function loadSidebar() {
        const friendsContainer = document.getElementById('friends-list'); 
        const groupsContainer = document.getElementById('groups-list'); 
        
        try {
            // 1. Fetch Friends
            const { data: friendsData, error: friendsError } = await mySupabase
                .from('friends')
                .select(`friend_id, friend_p:profiles!friends_friend_id_fkey(id, full_name, username, avatar_url)`)
                .eq('user_id', globalUserId)
                .eq('status', 'accepted');

            if (friendsError) throw new Error("Friends Error: " + friendsError.message);

            friendsContainer.innerHTML = '';
            if (friendsData && friendsData.length > 0) {
                friendsData.forEach(f => {
                    const friend = f.friend_p;
                    if (!friend) return;
                    const name = friend.full_name || friend.username || "Ẩn danh";
                    const avatarHtml = friend.avatar_url ? `<div class="widget-avatar" style="background-image: url(${friend.avatar_url}); background-size: cover; width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;"></div>` : `<div class="widget-avatar" style="width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; background: var(--border); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--primary); font-size: 14px;">${name.charAt(0).toUpperCase()}</div>`;
                    
                    const div = document.createElement('div');
                    div.className = 'widget-item'; 
                    div.style.cssText = "padding: 8px; border-radius: 8px; margin-bottom: 4px; transition: background 0.2s; cursor: pointer; width: 100%; box-sizing: border-box; overflow: hidden; height: 56px;";
                    div.onmouseover = () => div.style.background = 'rgba(7, 37, 77, 0.4)'; 
                    div.onmouseout = () => div.style.background = 'transparent'; 
                    div.onclick = () => openChatRoom(friend.id, name, friend.avatar_url, 'dm');
                    
                    // FIXED: Strictly constrained flexbox hierarchy with min-width: 0 on all textual parents
                    div.innerHTML = `
                        <div style="display: flex; gap: 10px; align-items: center; width: 100%; height: 100%; overflow: hidden; box-sizing: border-box;">
                            <div style="position: relative; flex-shrink: 0;">${avatarHtml}</div>
                            <div class="widget-text" style="flex: 1; min-width: 0; overflow: hidden; display: block;">
                                <h4 style="margin: 0; color: var(--text); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;">${name}</h4>
                                <div id="sidebar-snippet-friend-${friend.id}" style="display: flex; align-items: center; justify-content: space-between; margin-top: 3px; gap: 8px; width: 100%; overflow: hidden; box-sizing: border-box;">
                                    <div class="snippet-text" style="font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;">Trò chuyện 1-1</div>
                                    <div class="snippet-time" style="font-size: 11px; color: var(--text-muted); flex-shrink: 0; white-space: nowrap; text-align: right;"></div>
                                </div>
                            </div>
                        </div>
                    `;
                    friendsContainer.appendChild(div);
                });
            } else {
                friendsContainer.innerHTML = '<p class="empty-msg" style="font-size: 13px; color: var(--text-muted); text-align: center;">Không có mống bạn nào ở đây cả...</p>';
            }
            
            // 2. Fetch Groups
            const { data: groupsData, error: groupsError } = await mySupabase
                .from('group_members')
                .select(`groups ( id, title, cover_url, created_at )`)
                .eq('user_id', globalUserId)
                .in('status', ['joined', 'member', 'admin']);

            if (groupsError) throw new Error("Groups Error: " + groupsError.message);

            groupsContainer.innerHTML = '';
            if (groupsData && groupsData.length > 0) {
                await Promise.all(groupsData.map(async (item) => {
                    const group = item.groups;
                    if (!group) return;

                    const { data: latestMsg, error: msgError } = await mySupabase
                        .from('messages')
                        .select(`content, sender_id, created_at, profiles(full_name, username)`)
                        .eq('group_id', group.id)
                        .order('created_at', { ascending: false })
                        .limit(1)
                        .maybeSingle();

                    if (msgError) console.warn("Latest Msg Error for group " + group.id + ":", msgError);

                    item.latestMsg = latestMsg;
                    item.sort_time = latestMsg ? new Date(latestMsg.created_at).getTime() : new Date(group.created_at).getTime(); 
                }));

                groupsData.sort((a, b) => b.sort_time - a.sort_time);

                groupsData.forEach(item => {
                    const group = item.groups;
                    if (group) {
                        const avatarHtml = group.cover_url ? `<div class="widget-avatar" style="background-image: url(${group.cover_url}); background-size: cover; width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;"></div>` : `<div class="widget-avatar" style="width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--text);">${(group.title || "G").charAt(0).toUpperCase()}</div>`;
                        const div = document.createElement('div');
                        
                        div.className = 'widget-item group-sidebar-item'; 
                        div.style.cssText = "padding: 8px; border-radius: 8px; margin-bottom: 4px; transition: background 0.2s; cursor: pointer; width: 100%; box-sizing: border-box; overflow: hidden; height: 56px;";
                        
                        div.onmouseover = () => { if(currentGroupId !== group.id) div.style.background = 'rgba(7, 37, 77, 0.4)'; }; 
                        div.onmouseout = () => { if(currentGroupId !== group.id) div.style.background = 'transparent'; };
                        
                        if (group.id === currentGroupId) div.style.background = 'rgba(74, 144, 226, 0.15)';
                        
                        div.onclick = () => { 
                            window.history.replaceState({}, '', `/chat?group=${group.id}`); 
                            openChatRoom(group.id, group.title, group.cover_url); 
                            document.querySelectorAll('.group-sidebar-item').forEach(el => el.style.background = 'transparent');
                            div.style.background = 'rgba(74, 144, 226, 0.15)';
                        };

                        let snippetText = "Chưa có tin nhắn.";
                        let timeStr = "";
                        if (item.latestMsg) {
                            const isSelf = item.latestMsg.sender_id === globalUserId;
                            const senderName = isSelf ? "Bạn" : (item.latestMsg.profiles?.full_name || item.latestMsg.profiles?.username || "Ai đó");
                            let text = item.latestMsg.content.startsWith('[IMG]') ? '[Hình ảnh]' : item.latestMsg.content;
                            snippetText = `${senderName}: ${text}`;
                            timeStr = timeAgo(item.latestMsg.created_at);
                        }
                        
                        // FIXED: Strictly constrained flexbox hierarchy with min-width: 0 on all textual parents
                        div.innerHTML = `
                            <div style="display: flex; gap: 10px; align-items: center; width: 100%; height: 100%; overflow: hidden; box-sizing: border-box;">
                                <div style="position: relative; flex-shrink: 0;">${avatarHtml}</div>
                                <div class="widget-text" style="flex: 1; min-width: 0; overflow: hidden; display: block;">
                                    <h4 style="margin: 0; color: var(--text); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;">${group.title || "Nhóm ẩn danh"}</h4>
                                    <div id="sidebar-snippet-${group.id}" style="display: flex; align-items: center; justify-content: space-between; margin-top: 3px; gap: 8px; width: 100%; overflow: hidden; box-sizing: border-box;">
                                        <div class="snippet-text" style="font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;">${snippetText}</div>
                                        <div class="snippet-time" style="font-size: 11px; color: var(--text-muted); flex-shrink: 0; white-space: nowrap; text-align: right;">${timeStr}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                        groupsContainer.appendChild(div);
                    }
                });
            } else {
                groupsContainer.innerHTML = '<p class="empty-msg" style="font-size: 13px; color: var(--text-muted); text-align: center;">Bạn chưa vào nhóm nào cả!</p>';
            }

        } catch (err) {
            console.error("FATAL SIDEBAR ERROR:", err);
            if(friendsContainer.innerHTML.includes('Đang tải...')) friendsContainer.innerHTML = `<p style="color:#ff4d4f; font-size: 12px; padding: 10px;">Lỗi tải bạn bè: Mở F12 Console để xem chi tiết.</p>`;
            if(groupsContainer.innerHTML.includes('Đang tải...')) groupsContainer.innerHTML = `<p style="color:#ff4d4f; font-size: 12px; padding: 10px;">Lỗi tải nhóm: Mở F12 Console để xem chi tiết.</p>`;
        }
    }


    async function openChatRoom(targetId, title, coverUrl = null, type = 'group') {
        currentGroupId = targetId;  
        currentChatType = type;     

        document.getElementById('chat-title').innerText = title || "Người dùng";
        document.getElementById('chat-subtitle').innerText = "Đang tải...";

        const avatarDiv = document.getElementById('chat-avatar');
        if (coverUrl) { avatarDiv.innerText = ''; avatarDiv.style.backgroundImage = `url(${coverUrl})`; avatarDiv.style.backgroundSize = 'cover'; } 
        else { avatarDiv.style.backgroundImage = 'none'; avatarDiv.innerText = (title || "G").charAt(0).toUpperCase(); }

        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('chat-ui').style.display = 'flex';
        document.getElementById('chat-box').innerHTML = '';

        const leaveBtn = document.getElementById('leave-btn');

        if (type === 'group') {
            document.getElementById('toggle-members-btn').style.display = 'flex';
            document.getElementById('members-sidebar').style.display = 'flex'; // KHÔI PHỤC LẠI BẢNG
            if (leaveBtn) {
                leaveBtn.innerText = "Rời nhóm";
                leaveBtn.onclick = () => leaveCurrentGroup(); 
            }
            await loadGroupMembers(targetId);
            await loadChatHistory(targetId);
            resetUnreadCount(targetId);
        } else {
            document.getElementById('toggle-members-btn').style.display = 'none';
            document.getElementById('members-sidebar').style.display = 'none';
            document.getElementById('chat-subtitle').innerText = "Trò chuyện trực tiếp";

            if (leaveBtn) {
                leaveBtn.innerText = "Xóa tin nhắn";
                leaveBtn.onclick = () => alert("Chẳng có gì ở đây cả..."); 
            }

            await loadDirectChatHistory(targetId); 
        }
    }

            .match({ group_id: currentGroupId, user_id: newAdminId });

    async function leaveCurrentGroup() {
        if (!currentGroupId || !globalUserId || currentChatType === 'dm') return;

        const { data: members, error: fetchErr } = await mySupabase
            .from('group_members')
            .select('user_id, role')
            .eq('group_id', currentGroupId);

        if (fetchErr) return alert("Lỗi kiểm tra thành viên: " + fetchErr.message);

        const myInfo = members.find(m => m.user_id === globalUserId);
        const isAdmin = myInfo?.role === 'admin';
        const memberCount = members.length;

        // 1. TRƯỜNG HỢP: LÀ NGƯỜI CUỐI CÙNG (BẤT KỂ CHỨC VỤ)
        if (memberCount === 1) {
            if (confirm("Bạn là thành viên duy nhất. Nếu rời đi, nhóm này sẽ bị xóa vĩnh viễn. Bạn có chắc chưa?")) {
                try {
                    // Xóa lần lượt: Tin nhắn -> Thành viên -> Nhóm
                    const { error: msgErr } = await mySupabase.from('messages').delete().eq('group_id', currentGroupId); 
                    if (msgErr) throw msgErr;
                    
                    const { error: memErr } = await mySupabase.from('group_members').delete().eq('group_id', currentGroupId); 
                    if (memErr) throw memErr;
                    
                    const { error: grpErr } = await mySupabase.from('groups').delete().eq('id', currentGroupId); 
                    if (grpErr) throw grpErr;
                    
                    window.location.href = '/main';
                } catch (err) {
                    alert("Lỗi xóa nhóm: " + (err.message || "Lỗi không xác định từ máy chủ."));
                }
            }
            return;
        }

        // 2. TRƯỜNG HỢP: NHÓM CÒN NHIỀU NGƯỜI
        if (isAdmin) {
            // Bắt buộc nhường quyền Admin trước khi đi
            showAdminTransferList(members.filter(m => m.user_id !== globalUserId));
        } else {
            // Thành viên bình thường cứ thế rời đi
            if (confirm("Bạn có chắc chắn muốn rời nhóm này không?")) {
                const { error } = await mySupabase
                    .from('group_members')
                    .delete()
                    .match({ group_id: currentGroupId, user_id: globalUserId });

                if (error) alert("Lỗi khi rời nhóm: " + error.message);
                else window.location.href = '/chat';
            }
        }
    }
    
    async function loadChatHistory(groupId) {
        const { data } = await mySupabase.from('messages').select(`*, sender:profiles ( full_name, username, avatar_url)`).eq('group_id', groupId).order('created_at', { ascending: true });
        if (data) data.forEach(msg => { const displayName = msg.sender?.full_name || msg.sender?.username || "User-" + msg.sender_id.substring(0, 4); displayNewMessage(msg, displayName); });
    }

    async function loadDirectChatHistory(friendId) {
        const { data, error } = await mySupabase
            .from('direct_messages')
            .select(`*`) 
            .or(`and(sender_id.eq.${globalUserId},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${globalUserId})`)
            .order('created_at', { ascending: true });

        if (data) {
            const { data: friendProfile } = await mySupabase.from('profiles').select('full_name, username, avatar_url').eq('id', friendId).maybeSingle();
            const friendName = friendProfile?.full_name || friendProfile?.username || "Bạn";

            data.forEach(msg => {
                const displayName = msg.sender_id === globalUserId ? "Tôi" : friendName;
                msg.sender = { avatar_url: friendProfile?.avatar_url }; 
                displayNewMessage(msg, displayName);
            });
            
            await mySupabase
                .from('direct_messages')
                .update({ is_read: true })
                .eq('sender_id', friendId)
                .eq('receiver_id', globalUserId)
                .or('is_read.eq.false,is_read.is.null');
        }
    }

    function setupGlobalRealtimeListener() {
        if (globalMessagesChannel) return;
        globalMessagesChannel = mySupabase.channel('global-messages')
            // 1. LẮNG NGHE TIN NHẮN NHÓM
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                const msg = payload.new;
                // Nếu là chính mình gửi thì bỏ qua (vì hàm sendMessage đã render Lạc quan rồi)
                if (msg.sender_id === globalUserId) return;

                // Lấy thông tin profile người gửi (Bổ sung đầy đủ avatar_url để không bị crash)
                mySupabase.from('profiles').select('full_name, username, avatar_url').eq('id', msg.sender_id).single()
                    .then(({ data }) => {
                        const senderName = data?.full_name || data?.username || "User";
                        let text = msg.content.startsWith('[IMG]') ? '[Hình ảnh]' : msg.content;

                        const timeStr = timeAgo(msg.created_at);
                        updateSidebarSnippet(`sidebar-snippet-${msg.group_id}`, `${senderName}: ${text}`, timeStr);
                        moveGroupToTop(msg.group_id);

                        // Nếu đang mở đúng phòng chat nhóm này thì nổ tin nhắn lên màn hình ngay
                        if (String(msg.group_id) === String(currentGroupId) && currentChatType === 'group') {
                            msg.sender = { avatar_url: data?.avatar_url }; // Đã an toàn vì select có avatar_url
                            displayNewMessage(msg, senderName);
                            resetUnreadCount(currentGroupId);
                        }
                    });
            })
            // 2. LẮNG NGHE TIN NHẮN CÁ NHÂN (CHAT 1-1)
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages' }, (payload) => {
                const msg = payload.new;
                if (msg.sender_id === globalUserId) return;

                const partnerId = msg.sender_id; // Vì mình không phải người gửi, nên người gửi chính là partner

                mySupabase.from('profiles').select('full_name, username, avatar_url').eq('id', msg.sender_id).single()
                    .then(({ data }) => {
                        const senderName = data?.full_name || data?.username || "Bạn";
                        let text = msg.content.startsWith('[IMG]') ? '[Hình ảnh]' : msg.content;

                        const timeStr = timeAgo(msg.created_at);
                        updateSidebarSnippet(`sidebar-snippet-friend-${partnerId}`, `${senderName}: ${text}`, timeStr);

                        // Nếu đang mở đúng phòng chat cá nhân với người này thì nổ bong bóng chat
                        if (currentChatType === 'dm' && String(partnerId) === String(currentGroupId)) {
                            msg.sender = { avatar_url: data?.avatar_url };
                            displayNewMessage(msg, senderName);
                            // Đánh dấu đã xem tin nhắn này luôn vì mình đang mở khung chat
                            mySupabase.from('direct_messages').update({ is_read: true }).eq('id', msg.id).then();
                        }
                    });
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'friends' }, (payload) => {
                loadSidebar();
            })
            // THÊM ĐOẠN NÀY ĐỂ NGHE THU HỒI TIN NHÓM
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, (payload) => {
                const oldMsg = payload.old;
                removeMessageFromUI(oldMsg.id);
            })

            // THÊM ĐOẠN NÀY ĐỂ NGHE THU HỒI TIN CÁ NHÂN (DM)
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'direct_messages' }, (payload) => {
                const oldMsg = payload.old;
                removeMessageFromUI(oldMsg.id);
            })
            .subscribe();
    }

    async function uploadImage(event) {
        const file = event.target.files[0]; if (!file || !currentGroupId) return;
        event.target.value = '';

        const fileName = `${globalUserId}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
        const { data, error } = await mySupabase.storage.from('chat_images').upload(fileName, file);
        if (error) return alert("Lỗi tải ảnh: " + error.message);
        
        const { data: { publicUrl } } = mySupabase.storage.from('chat_images').getPublicUrl(fileName);
        const imgContent = `[IMG]${publicUrl}`;
        displayNewMessage({ content: imgContent, sender_id: globalUserId }, "Tôi");
        
        const snippetId = currentChatType === 'group' ? `sidebar-snippet-${currentGroupId}` : `sidebar-snippet-friend-${currentGroupId}`;
        updateSidebarSnippet(snippetId, `Bạn: [Hình ảnh]`, `vừa xong`);

        let dbResult;
        if (currentChatType === 'group') { 
            moveGroupToTop(currentGroupId);
            dbResult = await mySupabase.from('messages').insert([{content: imgContent, group_id: currentGroupId, sender_id: globalUserId }]).select();
        }
        else {                              
            dbResult = await mySupabase.from('direct_messages').insert([{
                content: imgContent,
                receiver_id: currentGroupId,
                sender_id: globalUserId,
                is_read: false
            }]).select();
        }

        if (dbResult.error) {alert("Lỗi lưu ảnh vào Database: " + dbResult.error.message);}
    }

    function displayNewMessage(msg, senderName) {
        const chatBox = document.getElementById('chat-box');
        if (!chatBox) return;

        const isSelf = msg.sender_id === globalUserId;
        const timeStr = timeAgo(msg.created_at || new Date());

        const wrapper = document.createElement('div');
        // GẮN ID CHO WRAPPER ĐỂ DỄ XÓA VỀ SAU
        wrapper.id = `msg-wrapper-${msg.id || 'temp'}`;
        wrapper.style.cssText = `display: flex; margin-bottom: 15px; width: 100%; justify-content: ${isSelf ? 'flex-end' : 'flex-start'}; align-items: flex-start; gap: 8px;`;

        // Nếu là tin nhắn của CHÍNH MÀY, cài sự kiện click chuột phải để thu hồi
        if (isSelf && msg.id) {
            wrapper.style.cursor = "context-menu";
            wrapper.title = "Click chuột phải để thu hồi tin nhắn";
            wrapper.oncontextmenu = (e) => {
                e.preventDefault(); // Chặn menu mặc định của trình duyệt
                deleteMessage(msg.id, currentChatType);
            };
        }

        let avatarHtml = '';
        if (!isSelf) {
            const avatarUrl = msg.sender?.avatar_url;
            avatarHtml = avatarUrl
                ? `<img src="${avatarUrl}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-bottom: 18px; cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1" onclick="window.location.href='/profile?id=${msg.sender_id}'">`
                : `<div style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; margin-bottom: 18px; cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1" onclick="window.location.href='/profile?id=${msg.sender_id}'">${senderName.charAt(0).toUpperCase()}</div>`;
        }

        let contentHtml = '';
        if (msg.content.startsWith('[IMG]')) {
            const imgUrl = msg.content.replace('[IMG]', '');
            contentHtml = `<img src="${imgUrl}" class="chat-image" style="cursor: zoom-in; max-width: 250px; border-radius: 12px; display: block;" onclick="openImageViewer('${imgUrl}')">`;
        } else {
            contentHtml = `<div class="message ${isSelf ? 'self' : 'other'}" style="margin: 0; max-width: fit-content; word-break: break-word;">${msg.content}</div>`;
        }

        wrapper.innerHTML = `
        ${avatarHtml}
        <div style="display: flex; flex-direction: column; align-items: ${isSelf ? 'flex-end' : 'flex-start'}; max-width: 70%;">
            ${!isSelf ? `<span style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-left: 4px; margin-bottom: 4px; cursor: pointer;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'" onclick="window.location.href='/profile?id=${msg.sender_id}'">${senderName}</span>` : ''}
            ${contentHtml}
            <span style="font-size: 10px; color: var(--text-muted); margin-top: 4px; margin-left: 4px; margin-right: 4px;">${timeStr}</span>
        </div>
    `;

        chatBox.appendChild(wrapper);
        setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 50);
    }

    async function sendMessage() {
        const input = document.getElementById('message-input'); const content = input.value.trim();
        if (!content || !currentGroupId) return;
        input.value = '';

        displayNewMessage({ content, sender_id: globalUserId }, "Tôi");

        const snippetId = currentChatType === 'group' ? `sidebar-snippet-${currentGroupId}` : `sidebar-snippet-friend-${currentGroupId}`;
        updateSidebarSnippet(snippetId, `Bạn: ${content}`, `vừa xong`);

        let result;

        if (currentChatType === 'group') {
            result = await mySupabase.from('messages').insert([{ content, group_id: currentGroupId, sender_id: globalUserId }]).select();
            if (!result.error) resetUnreadCount(currentGroupId);
            moveGroupToTop(currentGroupId);
        } else {
            result = await mySupabase.from('direct_messages').insert([{ content, receiver_id: currentGroupId, sender_id: globalUserId, is_read: false }]).select();
        }

        if (result.error) {
            alert("Lỗi gửi tin: " + result.error.message);
        } else if (result.data && result.data[0]) {
            // Lấy ra ID chính thức vừa được sinh ra trong Database
            const realId = result.data[0].id;

            // Tìm cái wrapper "tạm thời" lúc nãy trên màn hình
            const tempWrapper = document.getElementById('msg-wrapper-temp');
            if (tempWrapper) {
                tempWrapper.id = `msg-wrapper-${realId}`; // Đổi ID tạm thành ID thật

                // Gắn sự kiện chuột phải ngay lập tức cho nó, không cần bắt người dùng F5!
                tempWrapper.style.cursor = "context-menu";
                tempWrapper.title = "Click chuột phải để thu hồi tin nhắn";
                tempWrapper.oncontextmenu = (e) => {
                    e.preventDefault();
                    deleteMessage(realId, currentChatType);
                };
            }
        }
    }

    async function deleteMessage(messageId, tableType) {
        if (!confirm("Mày muốn thu hồi tin nhắn này hả?")) return;

        const tableName = (tableType === 'group') ? 'messages' : 'direct_messages';

        // Xóa trên Supabase
        const { error } = await mySupabase
            .from(tableName)
            .delete()
            .eq('id', messageId)
            .eq('sender_id', globalUserId); // Đảm bảo chỉ xóa được tin của chính mình

        if (error) {
            alert("Lỗi thu hồi: " + error.message);
        } else {
            // Tự xóa trên màn hình của mình trước cho mượt
            removeMessageFromUI(messageId);
        }
    }

    function removeMessageFromUI(messageId) {
        const msgWrapper = document.getElementById(`msg-wrapper-${messageId}`);
        if (msgWrapper) {
            // Thay vì xóa hẳn làm giật khung chat, mình đổi nội dung thành "Tin nhắn đã bị thu hồi" cho giống Messenger
            const msgBubble = msgWrapper.querySelector('.message');
            if (msgBubble) {
                msgBubble.innerText = "Tin nhắn đã bị thu hồi rồi";
                msgBubble.style.fontStyle = "italic";
                msgBubble.style.opacity = "0.5";
                // Xóa sự kiện click/thu hồi nếu có
                msgWrapper.oncontextmenu = null;
            } else {
                // Nếu là ảnh thì xóa hẳn cái wrapper
                msgWrapper.remove();
            }
        }
    }

    function openImageViewer(src) {
        if (!src || src === 'none') return;
        let viewer = document.getElementById('global-image-viewer');
        let img = document.getElementById('global-image-viewer-img');

        if (!viewer) {
            viewer = document.createElement('div');
            viewer.id = 'global-image-viewer';
            viewer.style.cssText = 'display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(5px); opacity: 0; transition: opacity 0.2s; overflow: hidden;';
            viewer.innerHTML = `
                <span style="position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; text-shadow: 0 2px 10px rgba(0,0,0,0.5); z-index: 10001;">&times;</span>
                <img id="global-image-viewer-img" src="" style="max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 5px 30px rgba(0,0,0,0.6); object-fit: contain; cursor: grab; transition: transform 0.1s ease-out;" draggable="false">
            `;
            img = viewer.querySelector('#global-image-viewer-img');
            viewer.scale = 1; viewer.tx = 0; viewer.ty = 0; viewer.isDragging = false; viewer.startX = 0; viewer.startY = 0;
            viewer.onclick = (e) => { if(e.target.id !== 'global-image-viewer-img') { viewer.style.opacity = '0'; setTimeout(() => { viewer.style.display = 'none'; }, 200); } };
            viewer.addEventListener('wheel', (e) => { e.preventDefault(); viewer.scale += e.deltaY * -0.002; viewer.scale = Math.min(Math.max(0.2, viewer.scale), 5); img.style.transform = `translate(${viewer.tx}px, ${viewer.ty}px) scale(${viewer.scale})`; }, { passive: false });
            img.addEventListener('mousedown', (e) => { e.preventDefault(); viewer.isDragging = true; viewer.startX = e.clientX - viewer.tx; viewer.startY = e.clientY - viewer.ty; img.style.cursor = 'grabbing'; img.style.transition = 'none'; });
            window.addEventListener('mouseup', () => { if (!viewer.isDragging) return; viewer.isDragging = false; img.style.cursor = 'grab'; img.style.transition = 'transform 0.1s ease-out'; });
            window.addEventListener('mousemove', (e) => { if (!viewer.isDragging) return; e.preventDefault(); viewer.tx = e.clientX - viewer.startX; viewer.ty = e.clientY - viewer.startY; img.style.transform = `translate(${viewer.tx}px, ${viewer.ty}px) scale(${viewer.scale})`; });
            document.body.appendChild(viewer);
        } else {
            img = document.getElementById('global-image-viewer-img');
        }
        viewer.scale = 1; viewer.tx = 0; viewer.ty = 0; img.style.transform = `translate(0px, 0px) scale(1)`; img.src = src;
        viewer.style.display = 'flex'; setTimeout(() => viewer.style.opacity = '1', 10);
    }

    function timeAgo(date) {
        if (!date) return "";
        const seconds = Math.floor((new Date() - new Date(date)) / 1000);
        if (seconds < 0) return "vừa xong";
        let interval = Math.floor(seconds / 31536000);
        if (interval >= 1) return interval + " năm trước";
        interval = Math.floor(seconds / 2592000);
        if (interval >= 1) return interval + " tháng trước";
        interval = Math.floor(seconds / 86400); 
        if (interval >= 1) return interval + " ngày trước";
        interval = Math.floor(seconds / 3600);
        if (interval >= 1) return interval + " giờ trước";
        interval = Math.floor(seconds / 60);
        if (interval >= 1) return interval + " phút trước";
        return "vừa xong";
    }
    
    function updateSidebarSnippet(id, text, time) {
        const el = document.getElementById(id);
        if (el) {
            const tSpan = el.querySelector('.snippet-text');
            const timeSpan = el.querySelector('.snippet-time');
            if (tSpan) tSpan.innerText = text;
            if (timeSpan) timeSpan.innerText = time;
        }
    }

    document.getElementById('send-btn').onclick = sendMessage;
    document.getElementById('message-input').onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };
    initApp();
</script>
</body>
</html>
